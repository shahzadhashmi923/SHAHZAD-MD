<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAHZAD-MD - Pair Code</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(34,197,94,.15),transparent 70%);z-index:-1}
.card{width:100%;max-width:400px;background:linear-gradient(145deg,#0a1410,#060a06);border:1px solid rgba(34,197,94,.3);border-radius:28px;padding:28px 22px;box-shadow:0 0 30px rgba(34,197,94,.15),inset 0 1px 0 rgba(255,255,255,.05);position:relative}
.card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,#22c55e,transparent)}
.logo-wrap{width:88px;height:88px;margin:0 auto 14px;background:radial-gradient(circle at 30% 30%,#4ade80,#16a34a 60%,#052e16);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(34,197,94,.6);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.title{font-family:'Orbitron';text-align:center;font-size:32px;font-weight:900;background:linear-gradient(#4ade80,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.sub{color:#6b7280;text-align:center;font-size:13px;margin:6px 0 18px}
.server-box{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:13px}
.s-btn{background:#22c55e;color:#000;border:0;padding:5px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.input-wrap{position:relative;margin-bottom:14px}
.input-wrap input{width:100%;padding:16px 14px;border-radius:14px;border:1px solid #1f2937;background:#050805;color:#fff;outline:none;font-size:15px;transition:.2s}
.input-wrap input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.main-btn{width:100%;padding:16px;border-radius:14px;border:0;background:linear-gradient(90deg,#22c55e,#16a34a);color:#000;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(34,197,94,.3);transition:.2s}
.main-btn:active{transform:scale(.98)}
.result{margin-top:18px;background:#020402;border:1px dashed rgba(34,197,94,.4);border-radius:14px;padding:16px;text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;color:#22c55e;font-weight:900;font-size:22px;letter-spacing:2px;word-break:break-all}
.copy-hint{color:#4b5563;text-align:center;font-size:11px;margin-top:8px}
.footer{margin-top:20px;text-align:center;font-size:11px;color:#374151}
</style>
</head>
<body>
<div class="card">
<div class="logo-wrap"><span style="font-size:36px">⚡</span></div>
<div class="title">SHAHZAD-MD</div>
<div class="sub">Ahmad-MD Style Pairing System</div>

<div class="server-box">
<span>Connected Server: <b id="s" style="color:#4ade80">19</b></span>
<button class="s-btn" onclick="let x=Math.floor(Math.random()*40)+1;document.getElementById('s').innerText=x;document.body.style.filter='hue-rotate('+(x*9)+'deg)';">Change</button>
</div>

<div class="input-wrap">
<input id="num" placeholder="9230xxxxxxx (with country code)" type="tel">
</div>
<button class="main-btn" onclick="gen()">Generate Pair Code</button>

<div class="result" id="res">•••• ••••</div>
<div class="copy-hint" id="hint">Code yahan ayega - Copy karke WhatsApp me lagao</div>
<div class="footer">Powered by SHAHZAD HASHMI • 2026</div>
</div>

<script>
async function gen(){
let n=document.getElementById('num').value.replace(/\D/g,'');
let r=document.getElementById('res');
let h=document.getElementById('hint');
if(n.length<10){r.innerText='Invalid Number';return}
r.innerText='⏳ Generating...';
h.innerText='Please wait...';
try{
let res=await fetch('/api/pair?num='+n);
let data=await res.json();
if(data.code){
r.innerText=data.code;
h.innerText='✅ Code Copied? WhatsApp > Linked Devices > Link with Phone Number';
navigator.clipboard.writeText(data.code);
}else{
r.innerText=data.error||'Error';
h.innerText='Try again with another number';
}
}catch(e){r.innerText='Server Error';h.innerText='API /pair check karo'}}
</script>
</body>
</html>
