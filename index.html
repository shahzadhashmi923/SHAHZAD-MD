<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAZI-MD</title><style>body{margin:0;background:#0a0f0a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:15px} .card{width:100%;max-width:420px;background:#121a12;border:1px solid rgba(34,197,94,.2);border-radius:24px;padding:20px} .logo{width:80px;height:80px;margin:10px auto;background:radial-gradient(circle,#4ade80,#16a34a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px} .title{text-align:center;font-size:28px;font-weight:900;color:#4ade80} input{width:100%;padding:14px;border-radius:14px;border:1px solid #222;background:#0a0f0a;color:#fff;margin:10px 0} button{width:100%;padding:15px;border-radius:14px;border:0;background:#22c55e;color:#fff;font-weight:800;font-size:16px} .code{text-align:center;font-size:26px;font-weight:900;color:#4ade80;margin-top:15px;letter-spacing:3px}</style></head><body><div class="card"><div class="logo">⚡</div><div class="title">SHAZI-MD</div><p style="text-align:center;color:#9ca3af;font-size:13px">Generate Your Pairing Code</p><div style="background:rgba(34,197,94,.1);padding:10px;border-radius:10px;text-align:center;margin:12px 0;font-size:12px">Server <span id="s">19</span> <button onclick="s=Math.floor(Math.random()*30)+1;document.getElementById('s').innerText=s;document.body.style.filter='hue-rotate('+(s*30)+'deg)'" style="width:auto;padding:4px 10px;font-size:11px;margin-left:8px">Change</button></div><input id="num" placeholder="923xx... number with country code"><button onclick="gen()">Generate Pair Code</button><div id="res" class="code">Your code will appear here</div></div><script>async function gen(){let n=document.getElementById('num').value.replace(/\D/g,'');if(n.length<10)return alert('Valid number do');document.getElementById('res').innerText='Loading...';try{let r=await fetch('/api/pair?num='+n);let d=await r.json();document.getElementById('res').innerText=d.code||d.error}catch{ document.getElementById('res').innerText='Error, try again'}}</script></body></html>
